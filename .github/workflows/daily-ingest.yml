name: Daily ingest

on:
  schedule:
    - cron: "0 0 * * *"   # 00:00 UTC = 05:00 Pakistan time
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ingestion
        run: |
          curl --fail -X POST "${{ secrets.API_URL }}/ingest/run" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}"